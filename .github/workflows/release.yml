name: release

# Build + publish happens ONLY on demand:
#   * push a tag matching VERSION (e.g. v1.0.1)  → build AND publish
#   * manual run (workflow_dispatch)             → build only, artifacts
#     unless the "publish" checkbox is ticked explicitly
# Pushes to main/branches never build and never publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the build to the GitHub Release for the current ref (only meaningful when run on a tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          # pin the Playwright node driver to this exact version
          pip install "playwright==1.64.0" || true

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match VERSION $VERSION"
            exit 1
          fi

      - name: Build app, DMG and update ZIP
        run: bash desktop/build_dmg.sh

      - name: Smoke-test the bundle
        run: |
          APP="dist/Tennis Stats.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          # the bundled interpreter must at least start and reach the launcher
          ls "$APP/Contents/MacOS/"
          du -sh "$APP"

      - name: Publish release
        # tag push (a deliberate act) or a manual run with the publish box ticked
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
        uses: softprops/action-gh-release@v2
        with:
          name: Tennis Stats ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt

      - name: Upload artefacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TennisStats-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
